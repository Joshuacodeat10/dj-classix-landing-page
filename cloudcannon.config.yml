# CloudCannon Configuration
ssg_name: static
source: ""
output_dir: "." # Essential: Tells CloudCannon the root is the output

# 1. Force the Editor to recognize index.html
collections_config:
  pages:
    name: Pages
    path: ""
    filter: "index.html"
    _enabled_editors:
      - visual
      - content

# 2. Map your Front Matter to Sidebar Inputs
_inputs:
  hero_text:
    type: text
    label: "Event Date & Location"
  booking_url:
    type: url
    label: "Booking Form Link"

# 3. Enable the Visual Preview
editor:
  default_item_details:
    enabled: true
  preview:
    enabled: true
