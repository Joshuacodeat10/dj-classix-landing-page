# CloudCannon Configuration for DJ Classix Entertainment
# Optimized for a single-page HTML site at the root

source: "" # Essential for root-level HTML files
paths:
  uploads: images
  static: /

# 1. DEFINE YOUR EDITABLE PAGES
collections_config:
  pages:
    path: ""             # Look in the root folder
    output: true
    filter: 
      - "index.html"     # Targets your main file
    _enabled_editors: 
      - visual
      - content

# 2. CONFIGURE THE SIDEBAR INPUTS
# These match the keys in your index.html Front Matter
_inputs:
  hero_text:
    type: text
    label: "Event Date & Location"
    comment: "Format: FRIDAY, JUNE 26 2026 | 5PM SURULERE"
  
  booking_url:
    type: url
    label: "Booking Form Link"
  
  hero_image:
    type: image
    label: "Hero Background Image"

  about_image:
    type: image
    label: "About Section Image"

# 3. EDITOR SETTINGS
editor:
  default_item_details:
    enabled: true
  preview:
    enabled: true
