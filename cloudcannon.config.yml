# CloudCannon Configuration for DJ Classix Entertainment
source: "" 
paths:
  uploads: images
  static: /

collections_config:
  pages:
    path: ""             
    output: true
    filter: 
      - "index.html"     
    _enabled_editors: 
      - visual
      - content

_inputs:
  hero_text:
    type: text
    label: "Hero Event Text"
  booking_url:
    type: url
    label: "Global Booking Link"

editor:
  default_item_details:
    enabled: true
  preview:
    enabled: true
