# CloudCannon Configuration for DJ Classix Entertainment
# Forces CloudCannon to treat this as a simple Static HTML site
ssg_name: static
source: ""

# 1. DIRECTORIES
paths:
  uploads: images
  static: /

# 2. COLLECTIONS (This maps your index.html to the editor)
collections_config:
  pages:
    name: Pages
    path: ""             # Look in the root directory
    output: true
    filter: 
      - "index.html"     # Target your specific file
    _enabled_editors: 
      - visual
      - content

# 3. SIDEBAR INPUTS
# These must match the keys in your index.html front matter
_inputs:
  hero_text:
    type: text
    label: "Event Date & Location"
    comment: "Updates the text under the logo"
  
  booking_url:
    type: url
    label: "Global Booking Link"
    comment: "Updates all 'Book Event' buttons"
  
  hero_image:
    type: image
    label: "Hero Background Image"

# 4. EDITOR INTERFACE
editor:
  default_item_details:
    enabled: true
  preview:
    enabled: true

# 5. BUILD SETTINGS (Ensures your site actually renders)
build:
  source: ""
  output: "_site"
