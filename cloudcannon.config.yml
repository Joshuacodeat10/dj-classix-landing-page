# CloudCannon Configuration for DJ Classix Entertainment
# Optimized for a single-page HTML site

# 1. DEFINE YOUR DIRECTORIES
paths:
  uploads: images
  static: /

# 2. DEFINE YOUR EDITABLE PAGES
collections_config:
  pages:
    path: ""             # This tells CloudCannon to look in the root folder
    output: true
    filter: 
      - "index.html"     # Specifically targets your main file
    _enabled_editors: 
      - visual
      - content

# 3. CONFIGURE THE SIDEBAR INPUTS
# These names MUST match the words between the --- dashes in your index.html
_inputs:
  hero_text:
    type: text
    label: "Event Date & Location"
    comment: "Current: FRIDAY, JUNE 26 2026 | 5PM SURULERE"
  
  booking_url:
    type: url
    label: "Booking Form Link"
  
  hero_image:
    type: image
    label: "Hero Background Image"

  about_image:
    type: image
    label: "About Section Image"

# 4. EDITOR SETTINGS
editor:
  default_item_details:
    enabled: true
  preview:
    enabled: true
