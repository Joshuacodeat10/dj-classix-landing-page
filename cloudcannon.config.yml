# CloudCannon Configuration
ssg_name: static
source: ""
output_dir: "." 

collections_config:
  pages:
    name: Pages
    path: ""
    # This ensures CloudCannon looks at your index.html specifically
    filter: "index.html" 
    _enabled_editors:
      - visual
      - content

_inputs:
  hero_text:
    type: text
    label: "Event Date & Location"
    comment: "This updates the text appearing on the hero image."
  booking_url:
    type: url
    label: "Booking Form Link"

editor:
  default_item_details:
    enabled: true
  preview:
    enabled: true
